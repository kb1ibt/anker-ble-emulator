name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run sphinx-build -W -b html docs docs/_build/html

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -n8 -rs

  # A rolling GitHub pre-release of main; a full release deletes it.
  dev-release:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: dev-release
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - name: Replace the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(uv run --no-project --with packaging python -c \
            "import pathlib; from packaging.utils import parse_wheel_filename as p; print(p(next(pathlib.Path('dist').glob('*.whl')).name)[1])")
          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --cleanup-tag --yes
          fi
          gh release create dev dist/*.whl dist/*.tar.gz --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build $version" \
            --notes "Built from ${GITHUB_SHA} on main. Replaced on every push; removed by the next full release."
